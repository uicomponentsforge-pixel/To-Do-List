<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Todo List</h1>

    <form class="add" id="add-form" autocomplete="off">
      <label class="sr-only" for="task-input">New task</label>
      <input id="task-input" type="text" placeholder="What needs doing?" maxlength="120" required>
      <button type="submit">Add task</button>
    </form>

    <div class="filters" id="filters" role="group" aria-label="Filter tasks">
      <button type="button" class="filter active" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" class="filter" data-filter="completed" aria-pressed="false">Completed</button>
    </div>

    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden></p>

    <footer class="footer">
      <span id="count">0 tasks left</span>
      <button type="button" class="link" id="clear-done">Clear completed</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
